<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GM GN on Base</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 48px; font-family: Arial, Helvetica, sans-serif; background: #e8f0ff; color: #0f172a; }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { text-align: center; margin: 8px 0 4px; font-size: 28px; }
  .sub { text-align: center; color: #4a5878; margin: 0 0 20px; }
  .card { background: #ffffff; border: 1px solid #c9d8f7; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 16px rgba(0, 82, 255, 0.08); }
  .card h2 { margin: 0 0 14px; font-size: 16px; color: #4a5878; font-weight: 600; }
  .center { text-align: center; }
  button { font-size: 17px; padding: 14px 28px; border: none; border-radius: 12px; cursor: pointer; color: #ffffff; background: linear-gradient(135deg, #0052ff, #5b8cff); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary { font-size: 13px; padding: 6px 14px; margin-top: 8px; background: #ffffff; color: #0041cc; border: 1px solid #c9d8f7; }
  .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn-row button { flex: 1; min-width: 130px; }
  #account { margin-top: 12px; font-size: 14px; color: #4a5878; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat { text-align: center; }
  .num { font-size: 30px; font-weight: bold; color: #0052ff; }
  .label { font-size: 13px; color: #4a5878; }
  #status { min-height: 22px; text-align: center; word-break: break-all; font-size: 14px; }
  #status.ok { color: #16a34a; }
  #status.pending { color: #d97706; }
  #status.err { color: #dc2626; }
  a { color: #0041cc; }
  .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #c9d8f7; font-size: 15px; }
  .row:last-child { border-bottom: none; }
  .row.me { font-weight: bold; color: #0052ff; }
  .muted { color: #4a5878; font-size: 14px; text-align: center; }
  .modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal-card { background: #ffffff; border-radius: 16px; padding: 20px; width: 100%; max-width: 360px; text-align: center; }
  .modal-card h2 { margin: 0 0 14px; font-size: 18px; color: #0f172a; }
  .wallet-btn { display: flex; align-items: center; gap: 12px; width: 100%; margin-bottom: 8px; padding: 12px 14px; font-size: 16px; text-align: left; background: #ffffff; color: #0f172a; border: 1px solid #c9d8f7; }
  .wallet-btn img { width: 28px; height: 28px; border-radius: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>GM / GN on Base</h1>
  <p class="sub">Say GM or GN onchain</p>

  <div class="card center">
    <button id="connectBtn">Connect Wallet</button>
    <div id="account"></div>
    <button id="disconnectBtn" class="secondary" style="display:none;">Disconnect</button>
    <div class="btn-row" style="margin-top:16px;">
      <button id="gmBtn" disabled>Say GM</button>
      <button id="gnBtn" disabled>Say GN</button>
    </div>
    <div class="grid" style="margin-top:20px;">
      <div class="stat"><div class="num" id="myGm">-</div><div class="label">Your GM</div></div>
      <div class="stat"><div class="num" id="myGn">-</div><div class="label">Your GN</div></div>
    </div>
    <div id="status" style="margin-top:14px;"></div>
  </div>

  <div class="card">
    <h2>Global stats</h2>
    <div class="grid">
      <div class="stat"><div class="num" id="totalGm">-</div><div class="label">Total GM</div></div>
      <div class="stat"><div class="num" id="totalGn">-</div><div class="label">Total GN</div></div>
    </div>
    <div class="stat" style="margin-top:16px;"><div class="num" id="totalUsers">-</div><div class="label">Unique users</div></div>
  </div>

  <div class="card">
    <h2>Leaderboard (top 5 GM)</h2>
    <div id="board" class="muted">Loading...</div>
  </div>

  <p class="muted"><a id="contractLink" target="_blank">View contract on Basescan</a></p>
</div>

<div id="modal" class="modal" style="display:none;">
  <div class="modal-card">
    <h2>Choose wallet</h2>
    <div id="walletList"></div>
    <button id="closeModal" class="secondary">Cancel</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
<script>
  const CONTRACT_ADDRESS = "0xC26B5505630163c96C0aB9a584d990ABe4F63AAa".toLowerCase();
  const DEPLOY_BLOCK = 61800000;
  const BASE_CHAIN_ID = "0x2105";
  const ABI = [
    "function sayGM()",
    "function sayGN()",
    "function gmCount(address) view returns (uint256)",
    "function gnCount(address) view returns (uint256)",
    "event GMSent(address indexed user, uint256 time)",
    "event GNSent(address indexed user, uint256 time)"
  ];
  const RPCS = [
    "https://base-rpc.publicnode.com",
    "https://mainnet.base.org",
    "https://base.drpc.org"
  ];

  const TOPIC_GM = ethers.id("GMSent(address,uint256)");
  const TOPIC_GN = ethers.id("GNSent(address,uint256)");
  const CHUNK = 9000;
  const PARALLEL = 4;
  const CACHE_KEY = "gmgn_stats_v2_" + DEPLOY_BLOCK + "_" + CONTRACT_ADDRESS;
  const WALLET_KEY = "gmgn_last_wallet";

  const $ = (id) => document.getElementById(id);
  const setStatus = (msg, cls) => { $("status").innerHTML = msg; $("status").className = cls || ""; };
  $("contractLink").href = "https://basescan.org/address/" + CONTRACT_ADDRESS;

  const readProvider = new ethers.JsonRpcProvider(RPCS[0]);
  const readContract = new ethers.Contract(CONTRACT_ADDRESS, ABI, readProvider);
  let walletProvider = null;
  let provider, signer, contract, userAddress;

  /* ---------- wallet discovery (EIP-6963) ---------- */
  const wallets = [];
  function addWallet(detail) {
    if (!detail || !detail.info || !detail.provider) return;
    if (wallets.some((w) => w.info.uuid === detail.info.uuid)) return;
    wallets.push(detail);
  }
  window.addEventListener("eip6963:announceProvider", (e) => addWallet(e.detail));
  window.dispatchEvent(new Event("eip6963:requestProvider"));

  function getWalletList() {
    if (wallets.length > 0) return wallets;
    if (window.ethereum) {
      return [{ info: { name: "Browser wallet", icon: "", rdns: "injected", uuid: "injected" }, provider: window.ethereum }];
    }
    return [];
  }
  const walletId = (w) => w.info.rdns || w.info.name;

  function openModal(list) {
    const box = $("walletList");
    box.innerHTML = "";
    list.forEach((w) => {
      const btn = document.createElement("button");
      btn.className = "wallet-btn";
      if (w.info.icon && String(w.info.icon).indexOf("data:image") === 0) {
        const img = document.createElement("img");
        img.src = w.info.icon;
        btn.appendChild(img);
      }
      const name = document.createElement("span");
      name.textContent = w.info.name;
      btn.appendChild(name);
      btn.onclick = () => connectWith(w);
      box.appendChild(btn);
    });
    $("modal").style.display = "flex";
  }
  function closeModal() { $("modal").style.display = "none"; }

  /* ---------- stats ---------- */
  let statsData = { lastBlock: null, gmTotal: 0, gnTotal: 0, gmMap: {}, users: {} };
  let statsRunning = false;

  function loadCache() {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return null;
  }

  function saveCache(data) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (e) {}
  }

  function renderStats(data) {
    if (data.lastBlock === null) return;
    $("totalGm").textContent = data.gmTotal;
    $("totalGn").textContent = data.gnTotal;
    $("totalUsers").textContent = Object.keys(data.users).length;
    const top = Object.entries(data.gmMap).sort((a, b) => b[1] - a[1]).slice(0, 5);
    if (top.length === 0) { $("board").className = "muted"; $("board").textContent = "No GM yet. Be the first."; return; }
    $("board").className = "";
    $("board").innerHTML = top.map((e, i) => {
      const me = userAddress && e[0] === userAddress.toLowerCase() ? " me" : "";
      return '<div class="row' + me + '"><span>' + (i + 1) + ". " + e[0].slice(0, 6) + "..." + e[0].slice(-4) + "</span><span>" + e[1] + "</span></div>";
    }).join("");
  }

  async function scanRange(p, from, to, data) {
    const ranges = [];
    for (let s = from; s <= to; s += CHUNK) ranges.push([s, Math.min(s + CHUNK - 1, to)]);
    for (let i = 0; i < ranges.length; i += PARALLEL) {
      const batch = ranges.slice(i, i + PARALLEL);
      const results = await Promise.all(batch.map((r) => p.getLogs({
        address: CONTRACT_ADDRESS,
        fromBlock: r[0],
        toBlock: r[1],
        topics: [[TOPIC_GM, TOPIC_GN]]
      })));
      results.forEach((logs) => logs.forEach((l) => {
        const user = ("0x" + l.topics[1].slice(26)).toLowerCase();
        data.users[user] = true;
        if (l.topics[0] === TOPIC_GM) {
          data.gmTotal++;
          data.gmMap[user] = (data.gmMap[user] || 0) + 1;
        } else {
          data.gnTotal++;
        }
      }));
      data.lastBlock = batch[batch.length - 1][1];
      saveCache(data);
      renderStats(data);
    }
  }

  async function loadStats() {
    if (statsRunning) { renderStats(statsData); return; }
    statsRunning = true;
    const cached = loadCache();
    if (cached) statsData = cached;
    renderStats(statsData);

    let ok = false;
    for (const rpc of RPCS) {
      try {
        const p = new ethers.JsonRpcProvider(rpc);
        const latest = await p.getBlockNumber();
        let from;
        if (statsData.lastBlock !== null) from = statsData.lastBlock + 1;
        else from = DEPLOY_BLOCK > 0 ? DEPLOY_BLOCK : Math.max(latest - 100000, 0);
        if (from <= latest) await scanRange(p, from, latest, statsData);
        else renderStats(statsData);
        ok = true;
        break;
      } catch (err) {
        console.error(rpc, err);
      }
    }
    if (!ok && statsData.lastBlock === null) {
      $("board").textContent = "Could not load stats right now.";
    }
    statsRunning = false;
  }

  /* ---------- wallet connection ---------- */
  async function switchToBase() {
    try {
      await walletProvider.request({ method: "wallet_switchEthereumChain", params: [{ chainId: BASE_CHAIN_ID }] });
    } catch (err) {
      if (err.code === 4902) {
        await walletProvider.request({
          method: "wallet_addEthereumChain",
          params: [{
            chainId: BASE_CHAIN_ID,
            chainName: "Base Mainnet",
            nativeCurrency: { name: "ETH", symbol: "ETH", decimals: 18 },
            rpcUrls: ["https://mainnet.base.org"],
            blockExplorerUrls: ["https://basescan.org"]
          }]
        });
      } else { throw err; }
    }
  }

  function onAccountsChanged(accounts) {
    if (!accounts || accounts.length === 0) resetUI();
    else setupAccount().catch(console.error);
  }
  function onChainChanged() { window.location.reload(); }

  function attachListeners() {
    if (walletProvider && walletProvider.on) {
      walletProvider.on("accountsChanged", onAccountsChanged);
      walletProvider.on("chainChanged", onChainChanged);
    }
  }
  function detachListeners() {
    if (walletProvider && walletProvider.removeListener) {
      walletProvider.removeListener("accountsChanged", onAccountsChanged);
      walletProvider.removeListener("chainChanged", onChainChanged);
    }
  }

  function resetUI() {
    provider = null;
    signer = null;
    contract = null;
    userAddress = null;
    $("account").textContent = "";
    $("connectBtn").style.display = "";
    $("disconnectBtn").style.display = "none";
    $("gmBtn").disabled = true;
    $("gnBtn").disabled = true;
    $("myGm").textContent = "-";
    $("myGn").textContent = "-";
    setStatus("");
    renderStats(statsData);
  }

  async function setupAccount() {
    provider = new ethers.BrowserProvider(walletProvider);
    signer = await provider.getSigner();
    userAddress = await signer.getAddress();
    contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);
    $("account").textContent = "Connected: " + userAddress.slice(0, 6) + "..." + userAddress.slice(-4);
    $("connectBtn").style.display = "none";
    $("disconnectBtn").style.display = "";
    $("gmBtn").disabled = false;
    $("gnBtn").disabled = false;
    setStatus("");
    renderStats(statsData);
    await loadMyCounts();
  }

  async function connectWith(w) {
    closeModal();
    try {
      detachListeners();
      walletProvider = w.provider;
      await walletProvider.request({ method: "eth_requestAccounts" });
      await switchToBase();
      attachListeners();
      await setupAccount();
      try { localStorage.setItem(WALLET_KEY, walletId(w)); } catch (e) {}
    } catch (err) {
      walletProvider = null;
      setStatus("Connection failed: " + (err.shortMessage || err.message), "err");
    }
  }

  function connect() {
    const list = getWalletList();
    if (list.length === 0) { setStatus("No wallet found. Please install a wallet extension first.", "err"); return; }
    if (list.length === 1) { connectWith(list[0]); return; }
    openModal(list);
  }

  async function disconnectWallet() {
    try {
      await walletProvider.request({
        method: "wallet_revokePermissions",
        params: [{ eth_accounts: {} }]
      });
    } catch (err) {
      console.error(err);
    }
    detachListeners();
    walletProvider = null;
    try { localStorage.removeItem(WALLET_KEY); } catch (e) {}
    resetUI();
  }

  async function autoConnect() {
    await new Promise((r) => setTimeout(r, 400));
    let saved = null;
    try { saved = localStorage.getItem(WALLET_KEY); } catch (e) {}
    if (!saved) return;
    const w = getWalletList().find((x) => walletId(x) === saved);
    if (!w) return;
    try {
      const accounts = await w.provider.request({ method: "eth_accounts" });
      const chainId = await w.provider.request({ method: "eth_chainId" });
      if (accounts.length > 0 && chainId === BASE_CHAIN_ID) {
        walletProvider = w.provider;
        attachListeners();
        await setupAccount();
      }
    } catch (err) {
      console.error(err);
    }
  }

  async function loadMyCounts() {
    try {
      $("myGm").textContent = (await readContract.gmCount(userAddress)).toString();
      $("myGn").textContent = (await readContract.gnCount(userAddress)).toString();
    } catch (err) { console.error(err); }
  }

  async function send(fnName) {
    try {
      setStatus("Opening wallet...", "pending");
      const data = contract.interface.encodeFunctionData(fnName);
      const hash = await walletProvider.request({
        method: "eth_sendTransaction",
        params: [{ from: userAddress, to: CONTRACT_ADDRESS, data: data }]
      });
      setStatus('Pending... <a href="https://basescan.org/tx/' + hash + '" target="_blank">View on Basescan</a>', "pending");
      await readProvider.waitForTransaction(hash);
      setStatus('Done! <a href="https://basescan.org/tx/' + hash + '" target="_blank">View on Basescan</a>', "ok");
      await loadMyCounts();
      loadStats();
    } catch (err) {
      setStatus("Failed: " + (err.shortMessage || err.message), "err");
    }
  }

  $("connectBtn").onclick = connect;
  $("disconnectBtn").onclick = disconnectWallet;
  $("closeModal").onclick = closeModal;
  $("modal").onclick = (e) => { if (e.target === $("modal")) closeModal(); };
  $("gmBtn").onclick = () => send("sayGM");
  $("gnBtn").onclick = () => send("sayGN");

  loadStats();
  autoConnect();
</script>
</body>
</html>
